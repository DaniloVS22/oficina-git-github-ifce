<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberQuiz IFCE</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="eyebrow">EXTENSÃO • FUNDAMENTOS DA SEGURANÇA</p>
    <h1>🛡️ CyberQuiz IFCE</h1>
    <p id="intro">Você sabe se proteger na internet? Responda às perguntas e descubra!</p>
    <section id="quiz" aria-live="polite">
      <p id="progress"></p>
      <h2 id="question">Preparado para o desafio?</h2>
      <div id="options"></div>
      <p id="feedback" role="status"></p>
      <p id="debate"></p>
      <button id="next" hidden>Próxima pergunta →</button>
    </section>
    <button id="start">Começar desafio</button>
    <footer>Feito na oficina Git e GitHub • IFCE</footer>
  </main>
</body>
</html>
